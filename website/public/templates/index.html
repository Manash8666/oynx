<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onyx Motion Studio — 70 Cinematic UI Heroes & WebGL Shaders</title>
<link rel="icon" type="image/svg+xml" href="/onyx-logo.svg">
<style>
  :root {
    --bg:#07080a; --fg:#f3f4f6; --muted:#9ca3af; --line:rgba(255,255,255,.08);
    --card:#0b0d11; --volt:#d8ff38; --card-hover:#12151d;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Geist", "Segoe UI", Roboto, sans-serif; padding:48px 24px 96px; -webkit-font-smoothing:antialiased; }
  header { max-width:1200px; margin:0 auto 40px; }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:rgba(216,255,56,0.1); border:1px solid rgba(216,255,56,0.3); color:var(--volt); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:12px; }
  h1 { font-size:clamp(32px,5vw,56px); font-weight:700; letter-spacing:-.04em; line-height:1.05; margin-bottom:12px; }
  h1 em { font-style:normal; color:var(--volt); }
  p { color:var(--muted); font-size:16px; max-width:680px; line-height:1.6; }
  .mode { display:inline-flex; background:#0b0d11; border:1px solid var(--line); border-radius:999px; padding:3px; margin:24px 0 16px; gap:3px; }
  .mode button { font:inherit; font-size:13px; color:var(--muted); background:none; border:none; border-radius:999px; padding:6px 14px; cursor:pointer; transition:.15s; }
  .mode button[aria-pressed="true"] { color:#07080a; background:var(--volt); font-weight:600; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; max-width:1200px; margin:0 auto 32px; }
  .filters button { font:inherit; font-size:12px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; transition:.15s; }
  .filters button:hover { border-color:rgba(255,255,255,.25); color:var(--fg); }
  .filters button[aria-pressed="true"] { background:rgba(216,255,56,0.12); border-color:var(--volt); color:var(--volt); font-weight:600; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:24px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s, transform .2s; }
  .card:hover { border-color:rgba(216,255,56,0.3); transform:translateY(-2px); }
  .frame { aspect-ratio:16/10; position:relative; overflow:hidden; background:#07080a; }
  .frame iframe { position:absolute; top:0; left:0; border:none; transform-origin:0 0; pointer-events:none; opacity:0; transition:opacity .35s; }
  .frame iframe.ready { opacity:1; }
  .meta { padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:baseline; }
  .meta h2 { font-size:16px; font-weight:600; }
  .meta span { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .alt { font-size:12px; color:var(--muted); padding:0 16px 16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .alt a { color:var(--muted); text-decoration:none; font-weight:500; }
  .alt a:hover { color:var(--volt); }
  .alt button { font:inherit; font-size:12px; color:var(--fg); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; transition:.15s; }
  .alt button:hover { background:rgba(255,255,255,.14); border-color:rgba(255,255,255,0.2); }
  .alt button.ok { background:var(--volt); color:#07080a; border-color:var(--volt); font-weight:600; }
  .alt .sp { flex:1; }
  .star { position:fixed; top:20px; right:20px; z-index:50; display:inline-flex; align-items:center; gap:8px; padding:8px 14px; background:var(--card); border:1px solid var(--line); border-radius:999px; color:var(--fg); font-size:12px; text-decoration:none; transition:.2s; }
  .star:hover { border-color:var(--volt); color:var(--volt); }
  .star svg { width:14px; height:14px; fill:currentColor; }
  .back-link { position:fixed; top:20px; left:20px; z-index:50; display:inline-flex; align-items:center; gap:6px; padding:8px 14px; background:var(--card); border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:12px; text-decoration:none; transition:.2s; }
  .back-link:hover { color:var(--fg); border-color:rgba(255,255,255,0.25); }
  @media (max-width:640px){ body { padding:72px 16px 64px; } main{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<a class="back-link" href="/">← Onyx IDE</a>
<a class="star" href="https://github.com/Manash8666/oynx.git" target="_blank" rel="noopener">
  <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  <span>Star on GitHub</span>
</a>

<header>
  <div class="badge">Onyx Generative UI Engine</div>
  <h1>Motion Studio: <em>70 Living Heroes</em></h1>
  <p>Self-contained, zero-build generative UI templates powered by native WebGL shaders and live interactive canvas physics. Ready to render in our IDE with any AI model.</p>
  <div class="mode" id="mode">
    <button aria-pressed="true" data-mode="">Full Hero</button>
    <button aria-pressed="false" data-mode="bg.html">Background Shader</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"></main>

<script src="/templates/manifest.js"></script>
<script>
  const list = window.TEMPLATES || [];
  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  let active = 'all';
  let page = '';

  document.getElementById('mode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    page = b.dataset.mode;
    document.querySelectorAll('#mode button').forEach(x => x.setAttribute('aria-pressed', x === b));
    unmount(); render();
  });

  const counts = {}; list.forEach(t => t.tags.forEach(g => counts[g] = (counts[g] || 0) + 1));
  const tags = ['all', ...Object.keys(counts).filter(g => counts[g] >= 3 && g !== 'image' && g !== 'webgl').sort((a, b) => counts[b] - counts[a])];
  filters.innerHTML = tags.map(t => `<button aria-pressed="${t === active}" data-tag="${t}">${t}</button>`).join('');
  filters.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    active = b.dataset.tag;
    filters.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });

  let render = function () {
    const items = list.filter(t => active === 'all' || t.tags.includes(active));
    if (!items.length) { grid.innerHTML = '<p class="empty">No matching templates.</p>'; return; }
    grid.innerHTML = items.map(t => `
      <div class="card" data-slug="${t.slug}">
        <a href="/templates/${t.slug}/${page}"><div class="frame" style="background:url(/templates/${t.slug}/${page ? 'thumb_bg.jpg' : 'thumb.jpg'}) center/cover,${t.poster}"></div></a>
        <div class="meta"><h2>${t.name}</h2><span>${t.tags.slice(0,3).join(' · ')}</span></div>
        <div class="alt"><button data-copy="hero">Copy hero</button><button data-copy="bg">Copy background</button><span class="sp"></span><a href="/templates/${t.slug}/" target="_blank">Open ↗</a></div>
      </div>`).join('');
  };
  render();

  const VW = 1280, VH = 800;
  let live = null;
  function fit(frame, iframe) { iframe.style.transform = `scale(${frame.clientWidth / VW})`; }
  function mount(card) {
    if (live && live.card === card) return;
    unmount();
    const frame = card.querySelector('.frame');
    const iframe = document.createElement('iframe');
    iframe.src = `/templates/${card.dataset.slug}/${page}?preview`;
    iframe.tabIndex = -1; iframe.setAttribute('aria-hidden', 'true');
    iframe.style.width = VW + 'px'; iframe.style.height = VH + 'px';
    iframe.onload = () => setTimeout(() => iframe.classList.add('ready'), 350);
    frame.appendChild(iframe); fit(frame, iframe);
    live = { card, iframe };
  }
  function unmount() { if (live) { live.iframe.remove(); live = null; } }
  grid.addEventListener('pointerover', e => { const c = e.target.closest('.card'); if (c && e.pointerType !== 'touch') mount(c); });
  grid.addEventListener('pointerleave', unmount);
  grid.addEventListener('focusin', e => { const c = e.target.closest('.card'); if (c) mount(c); });
  grid.addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c || e.target.closest('button')) return;
    if (matchMedia('(hover: none)').matches && !(live && live.card === c)) { e.preventDefault(); mount(c); }
  });
  const _render = render; render = () => { unmount(); _render(); };
  addEventListener('resize', () => live && fit(live.card.querySelector('.frame'), live.iframe));

  const HOST = location.origin;
  grid.addEventListener('click', async e => {
    const b = e.target.closest('button[data-copy]'); if (!b) return;
    const slug = b.closest('.card').dataset.slug, src = `${HOST}/templates/${slug}/bg.js`;
    let text;
    if (b.dataset.copy === 'hero') {
      text = await (await fetch(`/templates/${slug}/index.html`)).text();
      text = text.replace('<script src="bg.js"><\/script>', `<script src="${src}"><\/script>`);
    } else {
      text = `<!-- Onyx Motion background: place inside your section -->\n<section style="position:relative;min-height:100vh;isolation:isolate">\n  <canvas data-bg style="position:absolute;inset:0;width:100%;height:100%;z-index:-1"></canvas>\n</section>\n<script src="${src}"><\/script>\n`;
    }
    await navigator.clipboard.writeText(text);
    const was = b.textContent; b.textContent = 'Copied ✓'; b.classList.add('ok');
    setTimeout(() => { b.textContent = was; b.classList.remove('ok'); }, 1400);
  });
</script>
</body>
</html>
