# onyx_change - new file
name: "Setup Kilo"
description: "Install Onyx CLI globally"
runs:
  using: "composite"
  steps:
    - name: Install Onyx CLI
      run: curl -fsSL https://oynx.si/cli/install | bash
      shell: bash

    - name: Add Kilo to PATH
      run: echo "$HOME/.kilo/bin" >> $GITHUB_PATH
      shell: bash
