name: Check shared upstream annotations

on:
  pull_request:
    paths:
      - ".github/**"
      - "github/**"
      - "packages/extensions/**"
      - "packages/kilo-*/**"
      - "packages/*/src/kilocode/**"
      - "packages/*/src/kilo-*/**"
      - "packages/plugin-atomic-chat/**"
      - "packages/opencode/**"
      - "packages/core/**"
      - "packages/llm/**"
      - "packages/schema/**"
      - "packages/protocol/**"
      - "packages/server/**"
      - "packages/tui/**"
      - "packages/script/**"
      - "packages/shared/**"
      - "packages/storybook/**"
      - "packages/ui/**"
      - "script/**"
      - "package.json"
      - "bun.lock"
      - "!packages/kilo-jetbrains/**"
  workflow_dispatch:

jobs:
  check-annotations:
    name: Check onyx_change annotations
    if: github.repository == 'Manash8666/oynx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # onyx_change
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # onyx_change start
      - uses: ./.github/actions/setup-bun
        with:
          install: false
      # onyx_change end

      - name: Check onyx_change annotations in shared upstream files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            bun run script/check-opencode-annotations.ts --base "$BASE_SHA"
          else
            echo "No PR base SHA available (workflow_dispatch without PR context) — skipping."
          fi

      # onyx_change start
      - name: Check Effect Promise facade allowlist
        run: bun run script/check-opencode-promise-facades.ts

      - name: Check domain architecture boundaries and ratchets
        run: bun run script/check-architecture.ts

      - name: Test the Kilo duplication ratchet
        working-directory: packages/script
        run: bun test ./tests/check-kilocode-duplication.test.ts

      - name: Check Kilo-owned code duplication
        run: bun run check:duplication

      - name: Check model tool network boundary
        run: bun run script/check-model-tool-network.ts

      - name: Check workflow allowlist
        run: bun run script/check-workflows.ts
      # onyx_change end
