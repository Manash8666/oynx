name: Check markdown table padding

on:
  pull_request:
    paths:
      - "**/*.md"
      - "script/check-md-table-padding.ts"
      - ".github/workflows/check-md-table-padding.yml"
  workflow_dispatch:

jobs:
  check:
    name: Check markdown table padding
    if: github.repository == 'Manash8666/oynx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # onyx_change
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # onyx_change start
      - uses: ./.github/actions/setup-bun
        with:
          install: false
      # onyx_change end

      - name: Run check
        run: bun run script/check-md-table-padding.ts
