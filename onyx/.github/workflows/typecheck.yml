name: typecheck

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # onyx_change start
  changes:
    name: detect typecheck changes
    runs-on: ${{ github.repository == 'Manash8666/oynx' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }} # onyx_change
    outputs:
      javascript: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.javascript }}
      jetbrains: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.jetbrains }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Detect typecheck changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: Kilo-Org/paths-filter@668c092af3649c4b664c54e4b704aa46782f6f7c # v3
        with:
          predicate-quantifier: every
          filters: |
            javascript:
              - '**'
              - '!.changeset/**'
              - '!.kilo/plans/**'
              - '!packages/kilo-jetbrains/**'
            jetbrains:
              - '**'
              - '!.changeset/**'
              - '!.kilo/plans/**'
              - '!packages/opencode/**'
              - '!packages/kilo-vscode/**'
              - '!packages/kilo-docs/**'
  # onyx_change end

  typecheck-js:
    name: typecheck-js
    needs: changes # onyx_change
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.javascript == 'true' # onyx_change
    runs-on: ${{ github.repository == 'Manash8666/oynx' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }} # onyx_change
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # onyx_change

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # onyx_change start
      - name: Run TypeScript typecheck
        run: bun turbo typecheck --filter='!@kilocode/kilo-jetbrains'

      - name: Build Onyx Console
        run: bun turbo build --filter=@kilocode/kilo-console
      # onyx_change end

  # onyx_change start
  typecheck-jetbrains:
    name: typecheck-jetbrains
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.jetbrains == 'true'
    runs-on: ${{ github.repository == 'Manash8666/oynx' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }} # onyx_change
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run JetBrains typecheck
        run: ./gradlew typecheck
        working-directory: packages/kilo-jetbrains

  required:
    name: typecheck
    runs-on: ${{ github.repository == 'Manash8666/oynx' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }} # onyx_change
    needs:
      - typecheck-js
      - changes
      - typecheck-jetbrains
    if: always()
    steps:
      - name: Verify typecheck jobs passed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "javascript=${{ needs.changes.outputs.javascript }}"
          echo "typecheck-js=${{ needs.typecheck-js.result }}"
          echo "typecheck-jetbrains=${{ needs.typecheck-jetbrains.result }}"
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.changes.outputs.javascript }}" = "true" ]; then
            test "${{ needs.typecheck-js.result }}" = "success"
          else
            test "${{ needs.changes.outputs.javascript }}" = "false"
            test "${{ needs.typecheck-js.result }}" = "skipped"
          fi
          if [ "${{ needs.changes.outputs.jetbrains }}" = "true" ]; then
            test "${{ needs.typecheck-jetbrains.result }}" = "success"
          else
            test "${{ needs.changes.outputs.jetbrains }}" = "false"
            test "${{ needs.typecheck-jetbrains.result }}" = "skipped"
          fi
  # onyx_change end
